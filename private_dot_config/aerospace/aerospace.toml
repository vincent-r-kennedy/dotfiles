# AeroSpace window manager config
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Start AeroSpace at login
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# ──────────────────────────────────────────────
# Key bindings (alt as main modifier)
# ──────────────────────────────────────────────
[mode.main.binding]

# Focus (move between windows)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Layout
alt-slash = 'layout tiles horizontal vertical'  # toggle split direction
alt-comma = 'layout accordion horizontal vertical'  # toggle accordion (stacking)
alt-f = 'fullscreen'

# Float toggle
alt-shift-f = 'layout floating tiling'

# Balance sizes (equal split)
alt-shift-b = 'balance-sizes'

# Set 2/3 width for focused window (ultrawide layout)
alt-shift-u = 'resize width 200'

# Workspaces (1-9)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Cycle through windows in accordion (your right-side stack)
alt-tab = 'focus-back-and-forth'
alt-period = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
alt-shift-period = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'

# ──────────────────────────────────────────────
# Resize mode (alt-r to enter, esc to exit)
# ──────────────────────────────────────────────
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
enter = 'mode main'
esc = 'mode main'

# ──────────────────────────────────────────────
# Auto-layout: IntelliJ 2/3 left, right-side apps in accordion
# ──────────────────────────────────────────────
[[on-window-detected]]
if.app-id = 'com.jetbrains.intellij'
run = ['layout tiling']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout accordion']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['layout accordion']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['layout accordion']
